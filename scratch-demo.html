<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>fitbites — daily scratch</title>
<link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet">

<style>
:root {
  --brown: #c47a3a;
  --brown-dark: #a5621e;
  --bark: #2c1a0e;
  --cream: #fdf9f5;
  --oat: #f5ede0;
  --border: #ede3d8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Glacial Indifference', sans-serif;
  background: radial-gradient(circle at top, #4a2a14, var(--bark));
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  color: var(--bark);
}

.game-card {
  width: 100%;
  max-width: 380px;
  background: var(--cream);
  border-radius: 28px;
  padding: 24px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  text-align: center;
}

.badge {
  display: inline-block;
  background: var(--bark);
  color: var(--cream);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

h1 {
  font-size: 30px;
  line-height: 1;
  margin-bottom: 8px;
}

.subtitle {
  font-size: 15px;
  color: #6f5138;
  margin-bottom: 22px;
}

.scratch-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}

.scratch-box {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 22px;
  overflow: hidden;
  background: var(--oat);
  border: 2px solid var(--border);
  cursor: pointer;
}

.prize {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 12px;
  background: white;
}

.cover {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #d6d6d6, #a7a7a7);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  font-weight: 700;
  letter-spacing: 1px;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.scratch-box.revealed .cover {
  opacity: 0;
  transform: scale(1.15);
  pointer-events: none;
}

.result {
  min-height: 48px;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 18px;
}

button {
  border: none;
  background: var(--brown);
  color: white;
  padding: 14px 22px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
}

button:hover {
  background: var(--brown-dark);
}
</style>
</head>

<body>

<div class="game-card">
  <div class="badge">Daily Scratch</div>
  <h1>Scratch Your Fate</h1>
  <p class="subtitle">Three boxes. One chance. Too probably cheated.</p>

  <div class="scratch-grid">
    <div class="scratch-box"><img class="prize" src="too.png" alt="Too"><div class="cover">SCRATCH</div></div>
    <div class="scratch-box"><img class="prize" src="tiel.png" alt="Tiel"><div class="cover">SCRATCH</div></div>
    <div class="scratch-box"><img class="prize" src="burger.png" alt="Burger"><div class="cover">SCRATCH</div></div>
  </div>

  <div class="result" id="result">Choose wisely, warrior.</div>
  <button onclick="resetGame()">Play Again</button>
</div>

<script>
const boxes = document.querySelectorAll('.scratch-box');
const result = document.getElementById('result');

let revealed = 0;

boxes.forEach(box => {
  box.addEventListener('click', () => {
    if (box.classList.contains('revealed')) return;

    box.classList.add('revealed');
    revealed++;

    if (revealed === 3) {
      checkResult();
    }
  });
});

function checkResult() {
  const prizes = [...document.querySelectorAll('.prize')].map(img => img.alt);

  const tooCount = prizes.filter(p => p === 'Too').length;
  const tielCount = prizes.filter(p => p === 'Tiel').length;
  const burgerCount = prizes.filter(p => p === 'Burger').length;

  if (tooCount === 3) {
    result.textContent = 'TOO WENT BANANAS. Free Fitbites Daily.';
  } else if (tielCount === 3) {
    result.textContent = 'Tiel approves. Rare. Free Greek Yogurt Jar.';
  } else if (burgerCount >= 1) {
    result.textContent = 'Burger detected. The system wins today.';
  } else {
    result.textContent = 'No reward today. Come back tomorrow.';
  }
}

function resetGame() {
  boxes.forEach(box => box.classList.remove('revealed'));
  revealed = 0;
  result.textContent = 'Choose wisely, warrior.';
}
</script>

</body>
</html>
