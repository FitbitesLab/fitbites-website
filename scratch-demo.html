* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Glacial Indifference', 'Helvetica Neue', sans-serif;
  background: var(--bark);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  overflow: hidden;
}

.game-card {
  width: 100%;
  max-width: 360px;
  background: var(--cream);
  border-radius: 28px;
  padding: 32px 24px 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  text-align: center;
  position: relative;
}

.game-logo {
  height: 60px;
  object-fit: contain;
  margin-bottom: 8px;
}

.game-title {
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--brown);
  margin-bottom: 4px;
}

.game-subtitle {
  font-size: 12px;
  color: #8a6a4a;
  margin-bottom: 28px;
  letter-spacing: 0.5px;
}

/* SCRATCH GRID */
.scratch-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.scratch-cell {
  aspect-ratio: 1;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  border: 2px solid var(--border);
  background: var(--oat);
  cursor: pointer;
}

/* Hidden symbol underneath */
.symbol-layer {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  z-index: 1;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Scratch overlay on top */
.scratch-canvas {
  position: absolute;
  inset: 0;
  z-index: 2;
  border-radius: 14px;
  cursor: crosshair;
  touch-action: none;
}

/* Revealed state */
.scratch-cell.revealed .symbol-layer {
  transform: scale(1.15);
}

/* Result banner */
.result-banner {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease;
  min-height: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
}

.result-banner.show {
  opacity: 1;
  transform: translateY(0);
}

.result-emoji {
  font-size: 32px;
  margin-bottom: 6px;
  display: block;
  animation: bounce 0.6s ease;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.result-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--bark);
  margin-bottom: 4px;
}

.result-sub {
  font-size: 11px;
  color: #8a6a4a;
  letter-spacing: 0.5px;
}

/* Buttons */
.btn-play {
  width: 100%;
  border: none;
  border-radius: 14px;
  background: var(--brown);
  color: white;
  padding: 16px;
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  display: none;
}

.btn-play:active { transform: scale(0.97); }
.btn-play:hover { background: var(--brown-dark); }
.btn-play.show { display: block; }

.scratch-hint {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #c4a882;
  margin-bottom: 20px;
  transition: opacity 0.3s;
}

/* Win pulse on card */
@keyframes winPulse {
  0%, 100% { box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  50% { box-shadow: 0 20px 60px rgba(196, 122, 58, 0.6), 0 0 0 4px var(--brown); }
}

.game-card.win {
  animation: winPulse 0.8s ease 3;
}

/* Scratch texture color */
.scratch-canvas {
  background: #b8a898;
}

.prize-badge {
  display: inline-block;
  background: var(--brown);
  color: white;
  border-radius: 10px;
  padding: 8px 18px;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 8px;
}

  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <script>
    // ── SYMBOLS ──────────────────────────────────────────────────────────
    const SYMBOLS = [
      { emoji: '🦜', name: 'too',    weight: 35 },
      { emoji: '😤', name: 'tiel',   weight: 35 },
      { emoji: '🍔', name: 'burger', weight: 30 }
    ];

    const PRIZES = {
      too:    { title: 'FREE Fitbites Daily! 🎉', badge: '🎁 claim at the café', win: true },
      tiel:   { title: 'FREE Fitbites Mini! 😤', badge: '🎁 claim at the café', win: true },
      burger: null
    };

    // ── WEIGHTED RANDOM ──────────────────────────────────────────────────
    function weightedRandom() {
      // 99% chance = no win (burger appears at least once)
      // 1% chance = real win
      const roll = Math.random();
      if (roll < 0.99) {
        // Force a loss — guarantee at least one burger
        const symbols = [];
        const nonBurger = SYMBOLS.filter(s => s.name !== 'burger');
        // Pick 2 random non-burger
        symbols.push(nonBurger[Math.floor(Math.random() * nonBurger.length)]);
        symbols.push(nonBurger[Math.floor(Math.random() * nonBurger.length)]);
        symbols.push(SYMBOLS.find(s => s.name === 'burger')); // force burger
        // Shuffle
        return symbols.sort(() => Math.random() - 0.5);
      } else {
        // WIN — pick Too or Tiel, triple
        const winner = Math.random() < 0.5 ? 'too' : 'tiel';
        const sym = SYMBOLS.find(s => s.name === winner);
        return [sym, sym, sym];
      }
    }

    // ── GAME STATE ───────────────────────────────────────────────────────
    let symbols = [];
    let revealed = 0;
    let gameOver = false;

    // ── INIT ─────────────────────────────────────────────────────────────
    function initGame() {
      symbols  = weightedRandom();
      revealed = 0;
      gameOver = false;

      document.getElementById('resultBanner').classList.remove('show');
      document.getElementById('playAgain').classList.remove('show');
      document.getElementById('scratchHint').style.opacity = '1';
      document.getElementById('gameCard').classList.remove('win');

      buildGrid();
    }

    function buildGrid() {
      const grid = document.getElementById('scratchGrid');
      grid.innerHTML = '';

      symbols.forEach((sym, i) => {
        const cell = document.createElement('div');
        cell.className = 'scratch-cell';
        cell.id = 'cell-' + i;

        // Symbol underneath
        const symbolDiv = document.createElement('div');
        symbolDiv.className = 'symbol-layer';
        symbolDiv.textContent = sym.emoji;

        // Canvas on top
        const canvas = document.createElement('canvas');
        canvas.className = 'scratch-canvas';
        canvas.id = 'canvas-' + i;

        cell.appendChild(symbolDiv);
        cell.appendChild(canvas);
        grid.appendChild(cell);

        setupCanvas(canvas, i);
      });
    }

    // ── CANVAS SCRATCH ───────────────────────────────────────────────────
    function setupCanvas(canvas, index) {
      const cell   = canvas.parentElement;
      const size   = cell.offsetWidth || 100;
      canvas.width  = size;
      canvas.height = size;

      const ctx = canvas.getContext('2d');

      // Fill with scratch texture
      ctx.fillStyle = '#c4b5a5';
      ctx.fillRect(0, 0, size, size);

      // Add texture pattern
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      for (let x = 0; x < size; x += 4) {
        for (let y = 0; y < size; y += 4) {
          if (Math.random() > 0.5) ctx.fillRect(x, y, 2, 2);
        }
      }

      // Scratch icon hint
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = `${size * 0.35}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✦', size / 2, size / 2);

      let isDrawing = false;
      let revealedPixels = 0;
      const totalPixels = size * size;
      let checked = false;

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width  / rect.width;
        const scaleY = canvas.height / rect.height;
        if (e.touches) {
          return {
            x: (e.touches[0].clientX - rect.left) * scaleX,
            y: (e.touches[0].clientY - rect.top)  * scaleY
          };
        }
        return {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top)  * scaleY
        };
      }

      function scratch(e) {
        if (!isDrawing || gameOver) return;
        e.preventDefault();
        const { x, y } = getPos(e);
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, size * 0.18, 0, Math.PI * 2);
        ctx.fill();

        // Check reveal percentage
        if (!checked) {
          const data = ctx.getImageData(0, 0, size, size).data;
          let transparent = 0;
          for (let j = 3; j < data.length; j += 4) {
            if (data[j] < 128) transparent++;
          }
          if (transparent / (totalPixels) > 0.55) {
            checked = true;
            revealCell(index);
          }
        }
      }

      canvas.addEventListener('mousedown',  e => { isDrawing = true; scratch(e); });
      canvas.addEventListener('mousemove',  e => scratch(e));
      canvas.addEventListener('mouseup',    () => { isDrawing = false; });
      canvas.addEventListener('touchstart', e => { isDrawing = true; scratch(e); }, { passive: false });
      canvas.addEventListener('touchmove',  e => scratch(e), { passive: false });
      canvas.addEventListener('touchend',   () => { isDrawing = false; });
    }

    // ── REVEAL ────────────────────────────────────────────────────────────
    function revealCell(index) {
      const cell = document.getElementById('cell-' + index);
      cell.classList.add('revealed');

      // Clear canvas fully
      const canvas = document.getElementById('canvas-' + index);
      const ctx    = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      revealed++;
      playPop();

      if (revealed === 3) {
        setTimeout(checkResult, 400);
      }
    }

    // ── CHECK RESULT ─────────────────────────────────────────────────────
    function checkResult() {
      gameOver = true;
      document.getElementById('scratchHint').style.opacity = '0';

      const names   = symbols.map(s => s.name);
      const allSame = names.every(n => n === names[0]);
      const winner  = allSame ? names[0] : null;
      const prize   = winner ? PRIZES[winner] : null;

      const banner    = document.getElementById('resultBanner');
      const emoji     = document.getElementById('resultEmoji');
      const title     = document.getElementById('resultTitle');
      const sub       = document.getElementById('resultSub');
      const badge     = document.getElementById('prizeBadge');
      const playAgain = document.getElementById('playAgain');

      if (prize && prize.win) {
        // WIN!
        emoji.textContent = '🎉';
        title.textContent = prize.title;
        sub.textContent   = 'show this screen at the café';
        badge.innerHTML   = `<div class="prize-badge">${prize.badge}</div>`;
        document.getElementById('gameCard').classList.add('win');
        fireWin();
      } else {
        // LOSE
        const tielLines = [
          '…better luck tomorrow. 😤',
          '…Tiel predicted this.',
          '…try again. maybe.',
          '…the burger wins again. 🍔',
          '…Too ate your prize. 🦜'
        ];
        emoji.textContent = '😤';
        title.textContent = 'No win today.';
        sub.textContent   = tielLines[Math.floor(Math.random() * tielLines.length)];
        badge.innerHTML   = '';
      }

      banner.classList.add('show');
      playAgain.classList.add('show');
    }

    // ── SOUNDS ────────────────────────────────────────────────────────────
    function playPop() {
      try {
        const ctx  = new (window.AudioContext || window.webkitAudioContext)();
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
      } catch(e) {}
    }

    function fireWin() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523, 659, 784, 1047].forEach((freq, i) => {
          const osc  = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = freq; osc.type = 'sine';
          gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.25);
          osc.start(ctx.currentTime + i * 0.12);
          osc.stop(ctx.currentTime + i * 0.12 + 0.25);
        });
      } catch(e) {}

      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#c47a3a', '#e8a96a', '#2c1a0e', '#fdf9f5']
      });
    }

    // ── START ─────────────────────────────────────────────────────────────
    initGame();
  </script>
