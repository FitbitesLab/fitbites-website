  <style>
    :root {
      --brown: #c47a3a;
      --bark: #2c1a0e;
      --cream: #fdf9f5;
      --oat: #f5ede0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Glacial Indifference', 'Helvetica Neue', sans-serif;
      background: var(--oat);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 120px;
    }

    .placeholder {
      text-align: center;
      color: var(--bark);
      opacity: 0.3;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ── FLOATING NAV BAR ───────────────────────────────────────────────── */
    .nav-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 400px;
      height: 64px;
      background: var(--cream);
      border-radius: 32px;
      box-shadow:
        0 8px 32px rgba(44, 26, 14, 0.12),
        0 2px 8px rgba(44, 26, 14, 0.08),
        inset 0 1px 0 rgba(255,255,255,0.8),
        0 0 0 1px rgba(44, 26, 14, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 6px;
      z-index: 999;
    }

    /* ── SLIDING BUBBLE ─────────────────────────────────────────────────── */
    .nav-bubble {
      position: absolute;
      height: 48px;
      background: var(--brown);
      border-radius: 24px;
      z-index: 0;
      pointer-events: none;
      transition:
        left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
        width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.3s ease;
      will-change: left, width;
      box-shadow: 0 4px 16px rgba(196, 122, 58, 0.35);
    }

    /* ── NAV ITEMS ──────────────────────────────────────────────────────── */
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      position: relative;
      z-index: 1;
      padding: 8px 10px;
      border-radius: 20px;
      flex: 1;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke: rgba(44, 26, 14, 0.35);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
      transition:
        stroke 0.3s ease,
        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, stroke;
    }

    .nav-label {
      font-size: 7.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(44, 26, 14, 0.35);
      transition: color 0.3s ease;
      white-space: nowrap;
      will-change: color;
    }

    /* Active state — white on brown bubble */
    .nav-item.active svg {
      stroke: var(--cream);
      transform: translateY(-2px) scale(1.1);
    }

    .nav-item.active .nav-label {
      color: var(--cream);
    }

    .nav-item:active svg {
      transform: scale(0.85);
    }

    /* ── CENTER B COOKIE ────────────────────────────────────────────────── */
    .nav-center {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 2px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-center-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--brown);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 4px 20px rgba(196, 122, 58, 0.5),
        0 0 0 3px var(--cream),
        0 0 0 5px rgba(196, 122, 58, 0.2);
      transition:
        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.3s ease,
        background 0.3s ease;
      margin-bottom: 20px;
      will-change: transform;
    }

    .nav-center-btn img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      transition: filter 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: filter, transform;
    }

    .nav-center-btn.active {
      background: var(--bark);
      box-shadow:
        0 4px 20px rgba(44, 26, 14, 0.4),
        0 0 0 3px var(--cream),
        0 0 0 5px var(--brown);
      transform: translateY(-4px) scale(1.08);
    }

    .nav-center-btn.active img {
      filter: brightness(0) invert(1);
    }

    .nav-center-btn:active {
      transform: scale(0.88) translateY(-2px) !important;
    }

    .nav-center-label {
      font-size: 7.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(44, 26, 14, 0.35);
      text-align: center;
      margin-top: 2px;
      transition: color 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .nav-center.active .nav-center-label {
      color: var(--bark);
    }
  </style>

</head>

<body>

  </nav>

  <script>
    let current = null;
    const tabs = ['menu', 'card', 'profile', 'story'];
    const bubble = document.getElementById('navBubble');

    function moveBubble(el) {
      const navRect = document.getElementById('navBar').getBoundingClientRect();
      const elRect  = el.getBoundingClientRect();
      bubble.style.left    = (elRect.left - navRect.left) + 'px';
      bubble.style.width   = elRect.width + 'px';
      bubble.style.opacity = '1';
    }

    function hideBubble() {
      bubble.style.opacity = '0';
    }

    function setActive(tab) {
      tabs.forEach(t => {
        const el = document.getElementById('nav-' + t);
        if (el) el.classList.remove('active');
      });
      document.getElementById('nav-home').classList.remove('active');
      document.getElementById('nav-home-btn').classList.remove('active');

      current = tab;

      if (tab === 'home') {
        document.getElementById('nav-home').classList.add('active');
        document.getElementById('nav-home-btn').classList.add('active');
        hideBubble();
      } else {
        const el = document.getElementById('nav-' + tab);
        if (el) {
          el.classList.add('active');
          moveBubble(el);
        }
      }
    }

    // Init
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        bubble.style.transition = 'none';
        bubble.style.opacity = '0';
        const menuEl  = document.getElementById('nav-menu');
        const navRect = document.getElementById('navBar').getBoundingClientRect();
        const elRect  = menuEl.getBoundingClientRect();
        bubble.style.left  = (elRect.left - navRect.left) + 'px';
        bubble.style.width = elRect.width + 'px';
        requestAnimationFrame(() => {
          bubble.style.transition = `
            left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
            width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
            opacity 0.3s ease
          `;
          setActive('menu');
        });
      });
    });
  </script>
