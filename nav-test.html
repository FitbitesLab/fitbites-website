<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>fitbites — nav test</title>
  <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet" />

  <style>
    :root {
      --brown: #c47a3a;
      --bark: #2c1a0e;
      --cream: #fdf9f5;
      --oat: #f5ede0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Glacial Indifference', 'Helvetica Neue', sans-serif;
      background: var(--oat);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 120px;
    }

    .placeholder {
      text-align: center;
      color: var(--bark);
      opacity: 0.3;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ── NAV WRAPPER — positions everything ─────────────────────────────── */
    .nav-wrapper {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 400px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── B COOKIE — sits above the pill ────────────────────────────────── */
    .nav-cookie-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: -28px; /* overlap into pill */
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-cookie-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--cream);
      border: 2px solid rgba(196, 122, 58, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 4px 16px rgba(44, 26, 14, 0.12),
        0 0 0 4px var(--oat); /* gap between cookie and pill */
      transition:
        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
      will-change: transform;
    }

    .nav-cookie-btn img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: none; /* inactive = show original brown cookie */
      transition: filter 0.3s ease;
    }

    .nav-cookie-btn.active {
      background: var(--brown);
      border-color: var(--brown);
      box-shadow:
        0 6px 24px rgba(196, 122, 58, 0.5),
        0 0 0 4px var(--oat);
      transform: translateY(-4px) scale(1.08);
    }

    .nav-cookie-btn.active img {
      filter: brightness(0) invert(1); /* active = white cookie */
    }

    .nav-cookie-btn:active {
      transform: scale(0.88) !important;
    }

    .nav-cookie-label {
      font-size: 7.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(44, 26, 14, 0.4);
      margin-top: 32px; /* below the pill */
      transition: color 0.3s ease;
      position: absolute;
      bottom: -18px;
    }

    .nav-cookie-wrap.active .nav-cookie-label {
      color: var(--brown);
    }

    /* ── FLOATING PILL ──────────────────────────────────────────────────── */
    .nav-bar {
      width: 100%;
      height: 64px;
      background: var(--cream);
      border-radius: 32px;
      box-shadow:
        0 8px 32px rgba(44, 26, 14, 0.11),
        0 2px 8px rgba(44, 26, 14, 0.07),
        0 0 0 1px rgba(44, 26, 14, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 6px;
      position: relative;
      /* NO overflow:hidden — lets cookie float above */
    }

    /* ── SLIDING BUBBLE ─────────────────────────────────────────────────── */
.nav-bubble {
  position: absolute;
  top: 8px;
  left: 0; /* anchor point */
  height: 48px;
  background: var(--brown);
  border-radius: 24px;
  z-index: 0;
  pointer-events: none;

  /* GPU acceleration */
  transform: translateX(0);
  will-change: transform, width, opacity;

  transition:
    transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
    width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
    opacity 0.25s ease;

  box-shadow: 0 2px 12px rgba(196, 122, 58, 0.25);
}
    /* ── NAV ITEMS ──────────────────────────────────────────────────────── */
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      position: relative;
      z-index: 1;
      padding: 8px 10px;
      border-radius: 20px;
      flex: 1;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* spacer for center cookie */
    .nav-spacer {
      flex: 1;
      pointer-events: none;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke: rgba(44, 26, 14, 0.3);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
      transition:
        stroke 0.3s ease,
        transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform, stroke;
    }

    .nav-label {
      font-size: 7.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(44, 26, 14, 0.3);
      transition: color 0.3s ease;
      white-space: nowrap;
    }

    .nav-item.active svg {
      stroke: var(--cream);
      transform: translateY(-2px) scale(1.08);
    }

    .nav-item.active .nav-label {
      color: var(--cream);
    }

    .nav-item:active svg {
      transform: scale(0.85) !important;
    }
  </style>

</head>

<body>
  <p class="placeholder">fitbites nav test 🦜</p>

  </div>

 <script>
  const tabs = ['menu', 'card', 'profile', 'story'];

  const navBar     = document.getElementById('navBar');
  const bubble     = document.getElementById('navBubble');
  const homeWrap   = document.getElementById('nav-home');
  const homeBtn    = document.getElementById('nav-home-btn');

  const tabElements = {};
  tabs.forEach(t => {
    tabElements[t] = document.getElementById('nav-' + t);
  });

  let current = null;

  function getOffset(el) {
    const navRect = navBar.getBoundingClientRect();
    const elRect  = el.getBoundingClientRect();

    return {
      left: elRect.left - navRect.left,
      width: elRect.width
    };
  }

  function moveBubble(el) {
    const { left, width } = getOffset(el);

    bubble.style.transform = `translateX(${left}px)`;
    bubble.style.width = width + 'px';
    bubble.style.opacity = '1';
  }

  function hideBubble() {
    bubble.style.opacity = '0';
  }

  function clearActive() {
    tabs.forEach(t => tabElements[t].classList.remove('active'));
    homeWrap.classList.remove('active');
    homeBtn.classList.remove('active');
  }

  function setActive(tab) {
    if (current === tab) return; // kill useless re-renders
    current = tab;

    clearActive();

    if (tab === 'home') {
      homeWrap.classList.add('active');
      homeBtn.classList.add('active');
      hideBubble();
      return;
    }

    const el = tabElements[tab];
    if (!el) return;

    el.classList.add('active');
    moveBubble(el);
  }

  // ── INIT (no flicker, no delay)
  function initNav() {
    const menuEl = tabElements['menu'];
    const { left, width } = getOffset(menuEl);

    bubble.style.transition = 'none';
    bubble.style.transform  = `translateX(${left}px)`;
    bubble.style.width      = width + 'px';
    bubble.style.opacity    = '0';

    requestAnimationFrame(() => {
      bubble.style.transition = `
        transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
        width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.25s ease
      `;
      setActive('menu');
    });
  }

  // ── Resize = realignment (no drift)
  window.addEventListener('resize', () => {
    if (!current || current === 'home') return;
    moveBubble(tabElements[current]);
  });

  initNav();
</script>
