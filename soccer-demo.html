<canvas id="game" width="360" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const too = { x: 20, y: 200, w: 40, h: 40 };
const tiel = { x: 300, y: 200, w: 40, h: 40 };

const ball = {
  x: 180,
  y: 250,
  vx: 3,
  vy: 3,
  r: 10
};

function drawRect(p) {
  ctx.fillStyle = "#fff";
  ctx.fillRect(p.x, p.y, p.w, p.h);
}

function drawBall() {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = "#c47a3a";
  ctx.fill();
}

function update() {
  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.y < 0 || ball.y > canvas.height) ball.vy *= -1;

  // collision Too
  if (
    ball.x - ball.r < too.x + too.w &&
    ball.y > too.y &&
    ball.y < too.y + too.h
  ) {
    ball.vx *= -1;
  }

  // collision Tiel
  if (
    ball.x + ball.r > tiel.x &&
    ball.y > tiel.y &&
    ball.y < tiel.y + tiel.h
  ) {
    ball.vx *= -1;
  }

  // AI Tiel follows ball
  tiel.y += (ball.y - (tiel.y + tiel.h / 2)) * 0.1;

  // reset if goal
  if (ball.x < 0 || ball.x > canvas.width) {
    ball.x = 180;
    ball.y = 250;
  }
}

canvas.addEventListener("touchmove", e => {
  const rect = canvas.getBoundingClientRect();
  const y = e.touches[0].clientY - rect.top;
  too.y = y - too.h / 2;
});

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawRect(too);
  drawRect(tiel);
  drawBall();

  update();

  requestAnimationFrame(loop);
}

loop();
</script>
