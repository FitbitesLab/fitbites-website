<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fitbites World Cup Wheel</title>

<style>
@font-face {
    font-family: 'Glacial Indifference';
    src: url('GlacialIndifference-Regular.woff2') format('woff2');
}

:root{
    --cream:#F9F4EC;
    --milk:#FFFDF8;
    --coffee:#2A2A2A;
    --caramel:#D6B07D;
    --chocolate:#7A4F2A;
    --green:#6F7F4A;
    --strawberry:#E7A6A1;
    --gold:#E7C26B;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top left, rgba(214,176,125,.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(111,127,74,.22), transparent 35%),
        var(--cream);
    font-family:'Glacial Indifference', Arial, sans-serif;
    color:var(--coffee);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow-x:hidden;
}

.page{
    width:100%;
    max-width:1180px;
    padding:24px;
}

.card{
    position:relative;
    background:rgba(255,253,248,.94);
    border:1px solid rgba(214,176,125,.45);
    border-radius:42px;
    padding:34px 26px 42px;
    box-shadow:
        0 25px 70px rgba(77,54,37,.16),
        inset 0 0 0 1px rgba(255,255,255,.8);
}

.logo{
    font-size:34px;
    letter-spacing:4px;
    font-weight:900;
    margin-bottom:6px;
}

.tagline{
    font-size:13px;
    letter-spacing:5px;
    color:#9a7658;
    margin-bottom:18px;
}

h1{
    margin:0;
    font-size:42px;
    line-height:1.05;
    color:var(--coffee);
}

.sub{
    margin-top:10px;
    font-size:18px;
    color:#8b6a4e;
}

.stage{
    margin-top:34px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:56px;
}

.mascot{
    width:210px;
}

.mascot img{
    width:100%;
    height:auto;
    display:block;
    filter:drop-shadow(0 18px 24px rgba(77,54,37,.20));
    animation:float 4s ease-in-out infinite;
}

.too{
    width:220px;
}

.tiel{
    width:300px;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

.wheel-area{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.pointer{
    position:absolute;
    top:-22px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    width:44px;
    height:44px;
    background:var(--gold);
    border:4px solid var(--coffee);
    clip-path:polygon(50% 100%, 0 0, 100% 0);
    filter:drop-shadow(0 6px 8px rgba(77,54,37,.25));
}

#wheel{
    position:relative;
    width:390px;
    height:390px;
    border-radius:50%;
    margin:auto;
    border:12px solid var(--coffee);
    background:
        conic-gradient(
            var(--milk) 0deg 45deg,
            var(--strawberry) 45deg 90deg,
            var(--green) 90deg 135deg,
            #F3D7A5 135deg 180deg,
            #DFA76E 180deg 225deg,
            #C9897C 225deg 270deg,
            #A98F63 270deg 315deg,
            var(--gold) 315deg 360deg
        );
    transition:5.5s cubic-bezier(.12,.75,.18,1);
    box-shadow:
        0 25px 45px rgba(77,54,37,.25),
        0 0 0 10px rgba(214,176,125,.35),
        inset 0 0 35px rgba(255,255,255,.45);
}

#wheel::before{
    content:"";
    position:absolute;
    inset:18px;
    border-radius:50%;
    border:2px dashed rgba(255,253,248,.7);
}

.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:128px;
    height:128px;
    border-radius:50%;
    background:var(--milk);
    border:8px solid var(--coffee);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    box-shadow:0 10px 25px rgba(77,54,37,.25);
    z-index:3;
    font-weight:900;
    font-size:15px;
}

.center span{
    font-size:34px;
}

.prize{
    position:absolute;
    width:120px;
    left:50%;
    top:50%;
    transform-origin:center;
    font-size:13px;
    font-weight:900;
    color:var(--coffee);
    line-height:1.1;
}

.prize .icon{
    display:block;
    font-size:26px;
    margin-bottom:4px;
}

.p0{ transform:translate(-50%,-50%) rotate(22.5deg) translateY(-145px) rotate(-22.5deg); }
.p1{ transform:translate(-50%,-50%) rotate(67.5deg) translateY(-145px) rotate(-67.5deg); }
.p2{ transform:translate(-50%,-50%) rotate(112.5deg) translateY(-145px) rotate(-112.5deg); }
.p3{ transform:translate(-50%,-50%) rotate(157.5deg) translateY(-145px) rotate(-157.5deg); }
.p4{ transform:translate(-50%,-50%) rotate(202.5deg) translateY(-145px) rotate(-202.5deg); }
.p5{ transform:translate(-50%,-50%) rotate(247.5deg) translateY(-145px) rotate(-247.5deg); }
.p6{ transform:translate(-50%,-50%) rotate(292.5deg) translateY(-145px) rotate(-292.5deg); }
.p7{ transform:translate(-50%,-50%) rotate(337.5deg) translateY(-145px) rotate(-337.5deg); }

button{
    margin-top:30px;
    padding:18px 52px;
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
    color:var(--milk);
    background:linear-gradient(135deg,var(--coffee),var(--chocolate));
    border:none;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 14px 30px rgba(77,54,37,.25);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#result{
    margin-top:24px;
    font-size:28px;
    color:var(--coffee);
    min-height:74px;
}

.note{
    margin-top:16px;
    font-size:15px;
    color:#9a7658;
}

@media(max-width:950px){
    .stage{
        gap:20px;
    }

    .mascot{
        width:190px;
    }

    .tiel-placeholder{
        width:160px;
    }

    #wheel{
        width:330px;
        height:330px;
    }

    .prize{
        font-size:11px;
        width:96px;
    }

    .prize .icon{
        font-size:22px;
    }

    .p0{ transform:translate(-50%,-50%) rotate(22.5deg) translateY(-122px) rotate(-22.5deg); }
    .p1{ transform:translate(-50%,-50%) rotate(67.5deg) translateY(-122px) rotate(-67.5deg); }
    .p2{ transform:translate(-50%,-50%) rotate(112.5deg) translateY(-122px) rotate(-112.5deg); }
    .p3{ transform:translate(-50%,-50%) rotate(157.5deg) translateY(-122px) rotate(-157.5deg); }
    .p4{ transform:translate(-50%,-50%) rotate(202.5deg) translateY(-122px) rotate(-202.5deg); }
    .p5{ transform:translate(-50%,-50%) rotate(247.5deg) translateY(-122px) rotate(-247.5deg); }
    .p6{ transform:translate(-50%,-50%) rotate(292.5deg) translateY(-122px) rotate(-292.5deg); }
    .p7{ transform:translate(-50%,-50%) rotate(337.5deg) translateY(-122px) rotate(-337.5deg); }
}

@media(max-width:700px){
    body{
        align-items:flex-start;
    }

    .page{
        padding:14px;
    }

    .card{
        padding:26px 14px 34px;
    }

    h1{
        font-size:32px;
    }

    .tagline{
        font-size:10px;
        letter-spacing:3px;
    }

    .stage{
        flex-direction:column;
        gap:18px;
    }

    .mascot{
        width:220px;
        order:1;
    }

    .wheel-area{
        order:2;
    }

    .tiel-placeholder{
        display:none;
    }
}
</style>
</head>

<body>

<div class="page">
    <div class="card">

        <div class="logo">fitbites</div>
        <div class="tagline">HEALTH HAS NEVER TASTED THIS WRONG.</div>

        <h1>⚽ World Cup Wheel 🏆</h1>
        <div class="sub">Spin. Win. Smile. Repeat.</div>

        <div class="stage">

            <div class="mascot too">
                <img src="https://raw.githubusercontent.com/FitbitesLab/fitbites-website/main/icons/too-soccer.png" alt="Too soccer">
            </div>

            <div class="wheel-area">
                <div class="pointer"></div>

                <div id="wheel">
                    <div class="prize p0"><span class="icon">😭</span>Try Again</div>
                    <div class="prize p1"><span class="icon">🍫</span>Topping Protein Butter</div>
                    <div class="prize p2"><span class="icon">🥜</span>Peanut<br>Butter</div>
                    <div class="prize p3"><span class="icon">🍓</span>Fruit<br>Topping</div>
                    <div class="prize p4"><span class="icon">⭐</span>Bonus<br>Stamp</div>
                    <div class="prize p5"><span class="icon">🔥</span>Double<br>Stamps</div>
                    <div class="prize p6"><span class="icon">🥞</span>Free<br>Crepe</div>
                    <div class="prize p7"><span class="icon">🏆</span>Protein Ice Cream<br>Scoop</div>

                    <div class="center">
                        <span>⚽</span>
                        FITBITES
                    </div>
                </div>

                <button id="spinBtn" onclick="spinWheel()">SPIN</button>

                <h2 id="result"></h2>

                <div class="note">One spin per order above 100k ❤️</div>
            </div>

            <div class="mascot tiel">
    <img src="https://raw.githubusercontent.com/FitbitesLab/fitbites-website/main/icons/tiel-soccer-event.png" alt="Tiel soccer">
</div>
        </div>
    </div>
</div>

<script>
let currentRotation = 0;
let spinning = false;

function weightedPrize(){
    let r = Math.random() * 100;

    if(r < 1) return { name:"🏆 FREE ICE CREAM PINT", segment:7 };
    if(r < 6) return { name:"🥞 FREE PROTEIN CREPE", segment:6 };
    if(r < 16) return { name:"🔥 DOUBLE STAMPS", segment:5 };
    if(r < 30) return { name:"⭐ +1 BONUS STAMP", segment:4 };
    if(r < 45) return { name:"🍓 FREE FRUIT TOPPING", segment:3 };
    if(r < 60) return { name:"🥜 FREE PEANUT BUTTER", segment:2 };
    if(r < 80) return { name:"🍫 FREE CHOCOLATE DRIZZLE", segment:1 };

    return { name:"😭 TRY AGAIN", segment:0 };
}

function spinWheel(){
    if(spinning) return;

    spinning = true;

    const spinBtn = document.getElementById("spinBtn");
    const result = document.getElementById("result");
    const wheel = document.getElementById("wheel");

    spinBtn.disabled = true;
    result.innerHTML = "Too is calculating... 🦜";

    const prize = weightedPrize();
    const anglePerSegment = 45;

    const stopAngle = 360 - (prize.segment * anglePerSegment + anglePerSegment / 2);
    const targetAngle = 3600 + stopAngle;

    currentRotation += targetAngle;

    wheel.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(()=>{
        result.innerHTML = "🎉 You won:<br>" + prize.name;

        spinning = false;
        spinBtn.disabled = false;
    },5600);
}
</script>

</body>
</html>
