<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>fitbites — loyalty card</title>
  <link href="https://fonts.cdnfonts.com/css/glacial-indifference-2" rel="stylesheet" />

  <style>
    :root {
      --brown: #c47a3a;
      --brown-dark: #a5621e;
      --bark: #2c1a0e;
      --cream: #fdf9f5;
      --oat: #f5ede0;
      --border: #ede3d8;
      --stamp-empty: #e8d9c8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Glacial Indifference', 'Helvetica Neue', sans-serif;
      background: var(--cream);
      color: var(--bark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px;
    }

    .loyalty-card {
      width: 100%;
      max-width: 390px;
      background: var(--oat);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 36px 28px 32px;
      box-shadow: 0 10px 40px rgba(44, 26, 14, 0.08);
    }

    .logo {
      display: block;
      height: 52px;
      object-fit: contain;
      margin: 0 auto 34px;
    }

    .title {
      text-align: center;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--brown);
      margin-bottom: 22px;
    }

    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .stamp {
      aspect-ratio: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .stamp.empty {
      border: 2px solid var(--stamp-empty);
      background: transparent;
    }

    .stamp.filled {
      border: 2px solid var(--brown);
      background: var(--brown);
      box-shadow: 0 6px 16px rgba(196, 122, 58, 0.28);
    }

    .stamp.new {
      animation: stampIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes stampIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    .stamp img {
      width: 58%;
      height: 58%;
      object-fit: contain;
    }

    .stamp.empty img {
      opacity: 0.28;
    }

    .stamp.filled img {
      filter: brightness(0) invert(1);
      opacity: 1;
    }

    .progress {
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--bark);
      margin-bottom: 24px;
    }

    .progress span {
      color: var(--brown);
      font-weight: 700;
    }

    .scan-btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      background: var(--brown);
      color: white;
      padding: 18px 22px;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background 0.2s, transform 0.1s;
    }

    .scan-btn:hover { background: var(--brown-dark); }
    .scan-btn:active { transform: scale(0.98); }

    .scan-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .reward {
      display: none;
      text-align: center;
      margin-top: 26px;
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }

    .reward.show { display: block; }

    .reward-emoji {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .reward h2 {
      font-size: 24px;
      margin-bottom: 10px;
      color: var(--bark);
    }

    .reward p {
      font-size: 13px;
      line-height: 1.7;
      color: #8a6a4a;
      margin-bottom: 18px;
      max-width: 260px;
      margin-left: auto;
      margin-right: auto;
    }

    .reward-badge {
      display: inline-block;
      background: var(--brown);
      color: white;
      border-radius: 12px;
      padding: 12px 22px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .reward-reset {
      display: block;
      font-size: 10px;
      letter-spacing: 1px;
      color: #c4a882;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      text-transform: uppercase;
      margin: 0 auto;
    }

    /* SCANNER OVERLAY */
    .scanner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .scanner-overlay.open { display: flex; }

    .scanner-title {
      color: white;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 24px;
      text-align: center;
    }

    #qr-video {
      width: 100%;
      max-width: 300px;
      border-radius: 16px;
      border: 2px solid var(--brown);
      margin-bottom: 24px;
    }

    .scanner-close {
      color: white;
      background: none;
      border: 1px solid rgba(255,255,255,0.3);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 12px 28px;
      cursor: pointer;
      border-radius: 8px;
    }

    .scanner-status {
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      letter-spacing: 1px;
      margin-top: 16px;
      text-align: center;
      min-height: 20px;
    }

    .back-link {
      margin-top: 20px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--brown);
      text-decoration: none;
    }
  </style>

</head>

<body>
  <img src="/Fitbites_Logo.png" alt="fitbites" class="logo" />

<h1 class="title">your loyalty card</h1>

<section class="stamp-grid" id="stampGrid"></section>

<p class="progress">
  <span id="stampCount">0</span> / 9 stamps
</p>

<button class="scan-btn" id="scanBtn" onclick="openScanner()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
    <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
    <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
    <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
    <rect x="7" y="7" width="10" height="10" rx="1"/>
  </svg>
  scan to stamp
</button>

<section class="reward" id="reward">
  <span class="reward-emoji">🎉</span>
  <h2>you earned it.</h2>
  <p>show this screen to our team at the café to claim your free reward.</p>
  <div class="reward-badge">🎁 1 free fitbites</div>
  <button class="reward-reset" onclick="resetCard()">start a new card</button>
</section>

  </main>

<a href="/" class="back-link">← back to fitbites</a>

  <!-- SCANNER OVERLAY -->

  <div class="scanner-overlay" id="scannerOverlay">
    <p class="scanner-title">point at the café QR code</p>
    <video id="qr-video" autoplay playsinline muted></video>
    <button class="scanner-close" onclick="closeScanner()">cancel</button>
    <p class="scanner-status" id="scannerStatus">scanning...</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

  <script>
    // ── CONFIG ──
    const SECRET_CODE = 'FITBITES-STAMP-2025';
    const TOTAL_STAMPS = 9;
    const STORAGE_KEY = 'fitbites_loyalty_stamps';
    const STAMP_ICON = '/icons/stamp-icon.png';

    // ── STATE ──
    let stamps = parseInt(localStorage.getItem(STORAGE_KEY) || '0');
    if (isNaN(stamps) || stamps < 0 || stamps > TOTAL_STAMPS) stamps = 0;

    let scanning = false;
    let videoStream = null;
    let scanInterval = null;

    // ── RENDER ──
    function renderStamps() {
      const grid = document.getElementById('stampGrid');
      grid.innerHTML = '';

      for (let i = 0; i < TOTAL_STAMPS; i++) {
        const div = document.createElement('div');
        div.className = i < stamps ? 'stamp filled' : 'stamp empty';
        const img = document.createElement('img');
        img.src = STAMP_ICON;
        img.alt = '';
        div.appendChild(img);
        grid.appendChild(div);
      }

      document.getElementById('stampCount').textContent = stamps;

      const scanBtn = document.getElementById('scanBtn');
      const reward = document.getElementById('reward');

      if (stamps >= TOTAL_STAMPS) {
        scanBtn.style.display = 'none';
        reward.classList.add('show');
      } else {
        scanBtn.style.display = 'flex';
        reward.classList.remove('show');
      }
    }

    // ── ADD STAMP ──
    function addStamp() {
      if (stamps >= TOTAL_STAMPS) return;
      stamps++;
      localStorage.setItem(STORAGE_KEY, stamps);
      renderStamps();

      // Animate newest stamp
      const filled = document.querySelectorAll('.stamp.filled');
      if (filled.length > 0) {
        filled[filled.length - 1].classList.add('new');
      }
    }

    // ── RESET ──
    function resetCard() {
      stamps = 0;
      localStorage.setItem(STORAGE_KEY, 0);
      renderStamps();
    }

    // ── SCANNER ──
    function openScanner() {
      document.getElementById('scannerOverlay').classList.add('open');
      document.getElementById('scannerStatus').textContent = 'scanning...';
      startCamera();
    }

    function closeScanner() {
      document.getElementById('scannerOverlay').classList.remove('open');
      stopCamera();
    }

    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        const video = document.getElementById('qr-video');
        video.srcObject = videoStream;
        video.play();
        scanning = true;
        scanInterval = setInterval(scanFrame, 300);
      } catch (err) {
        document.getElementById('scannerStatus').textContent = 'camera access denied';
      }
    }

    function stopCamera() {
      scanning = false;
      clearInterval(scanInterval);
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
        videoStream = null;
      }
    }

    function scanFrame() {
      if (!scanning) return;
      const video = document.getElementById('qr-video');
      if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, canvas.width, canvas.height);

      if (code) {
        if (code.data === SECRET_CODE) {
          closeScanner();
          addStamp();
        } else {
          document.getElementById('scannerStatus').textContent = '❌ invalid QR code';
        }
      }
    }

    // ── INIT ──
    renderStamps();
  </script>

</body>
</html>
